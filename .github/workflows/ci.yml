name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Daywalker SDK Integrity
        run: node scripts/check-daywalker.mjs

      - name: Check Daywalker License Setup
        run: npx -p @shelbyb/daywalker-sdk daywalker license check

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test
