# Default: `docker compose up --build` runs Sonalyze in browser storage mode.
# Postgres: `docker compose --profile postgres up --build` with
#   DATABASE_URL=postgres://sonalyze:sonalyze@db:5432/sonalyze in your .env
services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_MODE: ${STORAGE_MODE:-}
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_USER: sonalyze
      POSTGRES_PASSWORD: sonalyze
      POSTGRES_DB: sonalyze
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonalyze -d sonalyze']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
