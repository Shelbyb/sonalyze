features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: web
    match:
      path:
        prefix: /
name: sonalyze
region: nyc
services:
- build_command: npm run build
  environment_slug: node-js
  envs:
  - key: SPOTIFY_CLIENT_ID
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:uJeDHKTAhrlI78QVodZywynG0trvdUz9:kyzqvehO4otXGqLjSt3l1A==]
  - key: SPOTIFY_CLIENT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:LTDw8pifyTsR1/5PQnjujjl9czunF43x:1PuTnzBPRDKqC74fIUDBqw==]
  - key: NEXTAUTH_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: EV[1:WuC0VLNEjuRByVElUxAuu19pYP0s45/T:YUCcVoHR8oP5po/EpCVuAA==]
  - key: NEXTAUTH_URL
    scope: RUN_AND_BUILD_TIME
    value: ${APP_URL}
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  github:
    branch: main
    deploy_on_push: true
    repo: Shelbyb/sonalyze
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xxs
  name: web
  run_command: npm start
